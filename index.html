<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO 카드 도감</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f7f5;color:#18291f}header{background:#173e31;color:white;padding:24px 18px}main{max-width:1060px;margin:auto;padding:20px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}input,select{border:1px solid #bacac0;border-radius:8px;padding:10px;font-size:16px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.item{background:white;padding:9px;border:1px solid #ddd;border-radius:10px}.item img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#e5ece7}.name{font-weight:700}.meta{font-size:13px;color:#607165}.note{font-size:12px;color:#607165}</style></head><body><header><h1>⚾ KBO 카드 도감</h1><p>2026 Official Collection Card+</p></header><main><p id="count">목록 불러오는 중…</p><div class="controls"><input id="search" placeholder="선수명·구단 검색"><select id="type"><option value="">전체 종류</option><option value="일반">일반</option><option value="기록형">기록형</option><option value="홀로">홀로</option></select></div><div class="gallery" id="gallery"></div><p class="note">선수명과 카드 종류는 사진 기준의 잠정 판정입니다. 교환 내역은 data/trades.json에 별도 기록합니다.</p></main><script>let cards=[];const g=document.querySelector('#gallery'),s=document.querySelector('#search'),t=document.querySelector('#type');function show(){let a=cards.filter(x=>(x.player+x.team).includes(s.value.trim())&&(!t.value||x.card_type.includes(t.value)));document.querySelector('#count').textContent=`전체 ${cards.length}장 · 표시 ${a.length}장`;g.replaceChildren();a.forEach(x=>{let el=document.createElement('div');el.className='item';let img=document.createElement('img');img.src=x.image;img.alt=x.player+' 카드';let n=document.createElement('div');n.className='name';n.textContent=x.player;let d=document.createElement('div');d.className='meta';d.textContent=x.team+' · '+x.card_type;el.append(img,n,d);g.append(el)})}s.addEventListener('input',show);t.addEventListener('change',show);fetch('data/cards.json').then(r=>r.json()).then(x=>{cards=x;show()}).catch(()=>document.querySelector('#count').textContent='파일은 웹 서버에서 열어주세요.');</script></body></html>
