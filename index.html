<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO 카드 도감</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f7f5;color:#18291f}header{background:#173e31;color:white;padding:24px 18px}main{max-width:1060px;margin:auto;padding:20px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}input,select{border:1px solid #bacac0;border-radius:8px;padding:10px;font-size:16px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.item{background:white;padding:9px;border:1px solid #ddd;border-radius:10px}.item img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#e5ece7}.name{font-weight:700}.meta{font-size:13px;color:#607165}.note{font-size:12px;color:#607165}</style></head><body><header><h1>⚾ KBO 카드 도감</h1><p>2026 Official Collection Card+</p></header><main><p id="count">목록 불러오는 중…</p><div class="controls"><input id="search" placeholder="선수명·구단·등번호 검색"><select id="team"><option value="">전체 구단</option><option value="KIA">KIA</option><option value="KT">KT</option><option value="LG">LG</option><option value="NC">NC</option><option value="SSG">SSG</option><option value="두산">두산</option><option value="롯데">롯데</option><option value="삼성">삼성</option><option value="키움">키움</option><option value="한화">한화</option></select><select id="type"><option value="">전체 종류</option><option value="일반">일반</option><option value="기록형">기록형</option><option value="홀로">홀로</option></select></div><div class="gallery" id="gallery"></div><p class="note">카드 도감 · 교환 내역은 별도 기록합니다.</p></main><script>let cards=[];const g=document.querySelector('#gallery'),s=document.querySelector('#search'),t=document.querySelector('#type'),team=document.querySelector('#team');const teamNames={KIA:'KIA 타이거즈 기아',KT:'KT 위즈 kt wiz',LG:'LG 트윈스',NC:'NC 다이노스',SSG:'SSG 랜더스',두산:'두산 베어스',롯데:'롯데 자이언츠',삼성:'삼성 라이온즈',키움:'키움 히어로즈',한화:'한화 이글스'};function normalize(x){return String(x??'').toLowerCase().replace(/\\s+/g,'')}function show(){let query=normalize(s.value);let a=cards.filter(x=>{let searchable=normalize([x.player,x.team,teamNames[x.team]||'',x.jersey_number,'등번호'+(x.jersey_number||'')].join(' '));return searchable.includes(query)&&(!team.value||x.team===team.value)&&(!t.value||x.card_type.includes(t.value))});document.querySelector('#count').textContent=`전체 ${cards.length}장 · 표시 ${a.length}장`;g.replaceChildren();a.forEach(x=>{let el=document.createElement('div');el.className='item';let img=document.createElement('img');img.src=x.image+'?v=20261114b';img.alt=x.player+' 카드';let n=document.createElement('div');n.className='name';n.textContent=x.player;let d=document.createElement('div');d.className='meta';d.textContent=x.team+' · '+(x.jersey_number?'No.'+x.jersey_number+' · ':'등번호 미확인 · ')+x.card_type;el.append(img,n,d);g.append(el)})}s.addEventListener('input',show);t.addEventListener('change',show);team.addEventListener('change',show);fetch('data/cards.json?v=20261114-jersey').then(r=>r.json()).then(x=>{cards=x;show()}).catch(()=>document.querySelector('#count').textContent='파일은 웹 서버에서 열어주세요.');</script></body></html>
