<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO Card Collection</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f8f7;color:#17221c}header{background:#173b30;color:white;padding:24px}main{max-width:1000px;margin:auto;padding:20px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select{padding:10px;border:1px solid #ccd4d0;border-radius:8px;font-size:16px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.card{background:#fff;border:1px solid #e2e6e3;border-radius:12px;padding:10px}.photo{width:100%;aspect-ratio:3/4;object-fit:contain;background:#e8eeea;border-radius:6px;display:grid;place-items:center;color:#7c8980}.player{font-weight:700;margin-top:8px}.meta{color:#63746a;font-size:13px}small{color:#63746a}
</style></head><body><header><h1>⚾ KBO Card Collection</h1><p>2026 Official Collection Card+ · 카드 도감</p></header>
<main><p id="count"></p><div class="controls"><input id="q" placeholder="선수명·구단 검색" aria-label="선수 검색"><select id="type"><option value="">전체 등급</option><option value="일반">일반</option><option value="기록형">기록형</option><option value="홀로">홀로</option></select></div><div id="cards" class="cards"></div><p><small>선수 정보와 등급은 사진 기준 잠정 판정입니다. 미업로드 사진은 빈 자리로 표시됩니다.</small></p></main>
<script>
let all=[]; const root=document.getElementById('cards'),q=document.getElementById('q'),kind=document.getElementById('type');
function render(){const v=all.filter(c=>(c.player+c.team).includes(q.value.trim())&&(!kind.value||c.card_type.includes(kind.value)));document.getElementById('count').textContent='표시 '+v.length+'장 / 등록 '+all.length+'장';root.replaceChildren();for(const c of v){const el=document.createElement('article');el.className='card';const photo=document.createElement('div');photo.className='photo';if(c.image){const im=document.createElement('img');im.src=c.image;im.alt=c.player+' 카드';im.className='photo';photo.append(im)}else photo.textContent='사진 업로드 예정';const name=document.createElement('div');name.className='player';name.textContent=c.player;const meta=document.createElement('div');meta.className='meta';meta.textContent=c.team+' · '+c.card_type;el.append(photo,name,meta);root.append(el)}}
q.addEventListener('input',render);kind.addEventListener('change',render);fetch('data/cards.json').then(x=>x.json()).then(x=>{all=x;render()}).catch(()=>{root.textContent='카드 목록을 불러오지 못했습니다.'});
</script></body></html>
