<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KBO 카드 도감</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#18291f;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}
header{background:#173e31;color:#fff;padding:25px 18px}header .inner,main{max-width:1060px;margin:auto}header h1{font-size:26px;margin:0 0 5px}header p{margin:0;color:#d1e4d8}main{padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #cddbd1;margin:0 0 20px}.tab{border:0;background:transparent;color:#53675b;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent}.tab[aria-selected="true"]{color:#126b45;border-color:#168556}
[hidden]{display:none!important}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 15px}input,select{border:1px solid #bacac0;border-radius:8px;padding:10px;font-size:15px;background:#fff}
input{flex:2;min-width:180px}select{flex:1;min-width:130px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.item{background:#fff;padding:9px;border:1px solid #ddd;border-radius:10px}.item img,.img-missing{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#e5ece7}.img-missing{display:flex;align-items:center;justify-content:center;text-align:center;color:#6b8170;font-size:13px}.name{font-weight:700;margin-top:6px}.meta{font-size:13px;color:#607165}.note,.muted{font-size:13px;color:#607165}.trade-intro{margin:0 0 15px}.trade{background:#fff;border:1px solid #d7e2da;border-radius:12px;padding:18px;margin:0 0 14px}.trade-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}.trade-head h3{font-size:17px;margin:0}.demo{font-size:12px;border-radius:20px;padding:4px 9px;color:#745300;background:#fff0bb;font-weight:700}.trade-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.trade-side{background:#f5f8f6;border-radius:10px;padding:12px}.trade-side h4{margin:0 0 8px;font-size:14px}.trade-side ul{list-style:none;padding:0;margin:0}.trade-side li{padding:6px 0;border-top:1px solid #dfe7e0;font-size:14px}.trade-side li:first-child{border-top:0}.trade-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,115px),1fr));gap:10px}.trade-card{min-width:0;background:#fff;border:1px solid #dce6df;border-radius:10px;padding:8px}.trade-card img,.trade-no-image{width:100%;aspect-ratio:3/4;object-fit:contain;background:#e5ece7;border-radius:6px;display:block}.trade-no-image{display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;color:#668173;font-size:12px}.trade-card .name{font-size:14px}.trade-card .meta{line-height:1.4;font-size:12px}.trade-qty{font-size:12px;font-weight:700;color:#285a3c;margin-top:5px}.empty{padding:22px;background:white;border-radius:10px;color:#56675c;text-align:center}
@media(max-width:600px){.trade-columns{gap:7px}.trade-side{padding:7px}.trade-card{padding:5px}.trade-cards{grid-template-columns:minmax(0,1fr)}.tab{flex:1}.gallery{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
</style></head>
<body><header><div class="inner"><h1>⚾ KBO 카드 도감</h1><p>2026 Official Collection Card · PLUS</p></div></header>
<main>
<nav class="tabs" role="tablist" aria-label="카드 도감 메뉴">
<button id="tab-cards" class="tab" type="button" role="tab" aria-controls="panel-cards" aria-selected="true">카드목록</button>
<button id="tab-trades" class="tab" type="button" role="tab" aria-controls="panel-trades" aria-selected="false">거래내역</button>
</nav>
<section id="panel-cards" role="tabpanel" aria-labelledby="tab-cards">
<p id="count">목록 불러오는 중…</p>
<div class="controls"><input id="search" placeholder="선수명·구단·등번호 검색" aria-label="카드 검색">
<select id="team" aria-label="구단 필터"><option value="">전체 구단</option><option>KIA</option><option>KT</option><option>LG</option><option>NC</option><option>SSG</option><option>두산</option><option>롯데</option><option>삼성</option><option>키움</option><option>한화</option></select>
<select id="type" aria-label="카드 종류 필터"><option value="">전체 종류</option><option value="노멀">노멀</option><option value="레코드">레코드</option><option value="홀로">홀로</option><option value="홀로 패러렐">홀로 패러렐</option><option value="알파벳">알파벳</option><option value="승리부적">승리부적</option><option value="사인">사인</option><option value="분류 미확인">분류 미확인</option></select></div>
<div class="gallery" id="gallery"></div>
</section>
<section id="panel-trades" role="tabpanel" aria-labelledby="tab-trades" hidden>
<p class="trade-intro">왼쪽은 내가 준 카드, 오른쪽은 받은 카드야. 한 번의 거래에서 여러 장을 주고받을 수 있어.</p>
<div id="trades-list"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const teamNames={KIA:'KIA 타이거즈 기아',KT:'KT 위즈 kt wiz',LG:'LG 트윈스',NC:'NC 다이노스',SSG:'SSG 랜더스',두산:'두산 베어스',롯데:'롯데 자이언츠',삼성:'삼성 라이온즈',키움:'키움 히어로즈',한화:'한화 이글스'};
const normalize=x=>String(x??'').toLowerCase().replace(/\s+/g,'');
let cards=[],trades=[];
function setTab(which){for(const name of ['cards','trades']){const active=name===which;$('panel-'+name).hidden=!active;$('tab-'+name).setAttribute('aria-selected',String(active))}location.hash=which}
$('tab-cards').addEventListener('click',()=>setTab('cards'));$('tab-trades').addEventListener('click',()=>setTab('trades'));
function showCards(){
const q=normalize($('search').value),team=$('team').value,type=$('type').value;
const shown=cards.filter(c=>c.status==='보유').filter(c=>{const searchable=normalize([c.player,c.team,teamNames[c.team]||'',c.jersey_number,'등번호'+(c.jersey_number||''),c.package_color?'노란색 패키지':'',c.product_series||''].join(' '));return searchable.includes(q)&&(!team||c.team===team)&&(!type||c.card_type===type)});
const pending=trades.filter(tr=>tr.status==='given_variant_confirmation_needed').length;const counted=cards.filter(c=>c.status==='보유').length; $('count').textContent=pending?('실제 보유 '+(counted-pending)+'장 · '+shown.length+'개 항목 표시 (강백호 교환 종류 확인 필요)'):('보유 '+counted+'장 · 표시 '+shown.length+'장');
$('gallery').replaceChildren();
for(const c of shown){const el=document.createElement('article');el.className='item';const img=document.createElement('img');img.src=c.image+'?v=20261126';img.alt=c.player+' 카드';img.loading='lazy';img.onerror=()=>{const empty=document.createElement('div');empty.className='img-missing';empty.textContent='사진 업로드 전';img.replaceWith(empty)};const name=document.createElement('div');name.className='name';name.textContent=c.player;const meta=document.createElement('div');meta.className='meta';meta.textContent=c.team+' · '+(c.jersey_number?'No.'+c.jersey_number+' · ':'')+(c.package_color?'노란색 패키지 · ':'')+c.card_type+(c.trade_variant_check?' · 거래 여부 확인 필요':'');el.append(img,name,meta);$('gallery').append(el)}
}
for(const id of ['search','team','type'])$(id).addEventListener(id==='search'?'input':'change',showCards);
const demoTrades=[
{id:'DEMO-001',date:'2026-11-14',given:[{player:'류현진',team:'한화',card_type:'일반 디자인',quantity:1},{player:'김주원',team:'NC',card_type:'일반 디자인',quantity:2}],received:[{player:'원태인',team:'삼성',card_type:'일반 디자인',quantity:1}],note:'가상 교환 예시 · 3장 ↔ 1장',demo:true},
{id:'DEMO-002',date:'2026-11-14',given:[{player:'박해민',team:'LG',card_type:'일반 디자인',quantity:1}],received:[{player:'곽빈',team:'두산',card_type:'일반 디자인',quantity:1},{player:'김태연',team:'한화',card_type:'기록형 디자인',quantity:1}],note:'가상 교환 예시 · 1장 ↔ 2장',demo:true}
];
function findCard(item){
if(item.card_id){const byId=cards.find(c=>c.id===item.card_id);if(byId)return byId}
const matching=cards.filter(c=>c.player===item.player&&c.team===item.team&&(!item.jersey_number||String(c.jersey_number)===String(item.jersey_number))&&(!item.card_type||c.card_type===item.card_type));
return matching.length===1?matching[0]:null;
}
function drawSide(title,items){
const side=document.createElement('div');side.className='trade-side';
const heading=document.createElement('h4');heading.textContent=title;side.append(heading);
const list=document.createElement('div');list.className='trade-cards';
for(const item of items){
const stored=findCard(item);
const card=document.createElement('article');card.className='trade-card';
const photo=stored?.image||item.image;
const fallback=()=>{const blank=document.createElement('div');blank.className='trade-no-image';blank.textContent='사진 업로드 전';return blank};
if(photo){const img=document.createElement('img');img.src=photo+'?v=20261126-trades';img.loading='lazy';img.alt=item.player+' 카드';img.onerror=()=>img.replaceWith(fallback());card.append(img)}else card.append(fallback());
const player=document.createElement('div');player.className='name';player.textContent=item.player||'이름 미확인';
const details=document.createElement('div');details.className='meta';details.textContent=[item.team||stored?.team,item.jersey_number?'No.'+item.jersey_number:(stored?.jersey_number?'No.'+stored.jersey_number:''),item.package_color||stored?.package_color?'노란색 패키지':'',item.card_type||stored?.card_type].filter(Boolean).join(' · ');
const qty=document.createElement('div');qty.className='trade-qty';qty.textContent='× '+(Number(item.quantity)||1)+'장';
card.append(player,details,qty);list.append(card)
}
if(!items.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='기록 없음';list.append(empty)}
side.append(list);return side
}
function showTrades(records,isDemo){const root=$('trades-list');root.replaceChildren();if(!records.length){root.textContent='아직 교환 기록이 없어.';return}
for(const [i,tr] of records.entries()){const article=document.createElement('article');article.className='trade';const head=document.createElement('div');head.className='trade-head';const title=document.createElement('h3');title.textContent=(tr.date||'날짜 미기록')+' · 교환 '+(i+1);head.append(title);if(isDemo){const badge=document.createElement('span');badge.className='demo';badge.textContent='가상 예시 · 실제 거래 아님';head.append(badge)}const cols=document.createElement('div');cols.className='trade-columns';cols.append(drawSide('내가 준 카드',tr.given||[]),drawSide('내가 받은 카드',tr.received||[]));article.append(head,cols);if(tr.note){const note=document.createElement('p');note.className='note';note.textContent=tr.note;article.append(note)}root.append(article)}
}
fetch('data/cards.json?v=20261126-yellow').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{cards=x;showCards();showTrades(trades.length?trades:demoTrades,!trades.length)}).catch(()=>$('count').textContent='카드 목록을 불러오지 못했습니다.');
fetch('data/trades.json?v=20261126-yellow').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{trades=Array.isArray(x)?x:[];showTrades(trades.length?trades:demoTrades,!trades.length);if(cards.length)showCards()}).catch(()=>showTrades(demoTrades,true));
if(['#cards','#trades'].includes(location.hash))setTab(location.hash.slice(1));else if(location.hash==='#traded-cards')setTab('trades');
</script></body></html>
