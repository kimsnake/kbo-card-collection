<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KBO Card Collection</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#f7f8f7;color:#17241b}*{box-sizing:border-box}body{margin:0}header{background:#143c2a;color:#fff;padding:28px 20px}header>div,main{max-width:1100px;margin:auto}h1{margin:0 0 5px;font-size:26px}p{margin:6px 0}main{padding:20px}.controls{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}input,select{padding:12px;font-size:16px;border:1px solid #cbd5cf;border-radius:10px;background:white;flex:1;min-width:130px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.card{padding:9px;background:white;border:1px solid #dfe6df;border-radius:12px}.card img{width:100%;aspect-ratio:3/4;object-fit:contain;border-radius:8px;background:#ecf2ed}.name{font-size:17px;font-weight:700;margin-top:7px}.meta{color:#66766a;font-size:13px}.tip{color:#637468;font-size:13px;margin-top:14px}#count{font-weight:650}button{border:none;background:#143c2a;color:white;border-radius:9px;padding:10px 14px;cursor:pointer}
</style></head><body><header><div><h1>⚾ KBO Card Collection</h1><p>2026 Official Collection Card+ · 나의 카드 도감</p></div></header><main><p id="count">카드 목록</p><div class="controls"><input id="q" placeholder="선수 또는 구단 검색" aria-label="검색"><select id="type"><option value="">전체 등급</option><option value="일반">일반</option><option value="기록형">기록형</option><option value="홀로">홀로</option></select></div><div class="grid" id="grid"></div><p class="tip">사진 기준 잠정 판정이 포함되어 있습니다. 판매액 및 수익 정보는 관리하지 않습니다.</p></main><script>
let data=[];const q=document.querySelector('#q'),kind=document.querySelector('#type'),grid=document.querySelector('#grid');function draw(){let cards=data.filter(c=>(c.player+' '+c.team).includes(q.value.trim())&&(!kind.value||c.card_type.includes(kind.value)));document.querySelector('#count').textContent=`보유 카드 ${cards.length}장 / 총 ${data.length}장`;grid.replaceChildren();for(const c of cards){let el=document.createElement('div');el.className='card';let pic=document.createElement('img');pic.src=c.image;pic.alt=c.player+' 야구카드';pic.loading='lazy';let name=document.createElement('div');name.className='name';name.textContent=c.player;let meta=document.createElement('div');meta.className='meta';meta.textContent=c.team+' · '+c.card_type;el.append(pic,name,meta);grid.append(el)}}q.addEventListener('input',draw);kind.addEventListener('change',draw);fetch('data/cards.json').then(x=>x.json()).then(v=>{data=v;draw()}).catch(()=>document.querySelector('#count').textContent='카드 정보를 불러올 수 없습니다. GitHub Pages에서 열어주세요.');</script></body></html>
